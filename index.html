<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ПИНОК ПО ВИРТУАЛЬНОМУ РЕБЁНКУ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght=400;700&display=swap');

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(#f8f1e3, #e8d9c0);
    color: #333;
    font-family: 'Comic Neue', cursive;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    transition: background 1.2s ease;

    touch-action: manipulation;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

#game {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 850px;
    border: 10px solid #5c4033;
    background: #fff9e6;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    overflow: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
}

/* Контейнер игровой зоны для удержания элементов на мобилках */
#actionArea {
    position: relative;
    width: 100%;
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

#kid {
    position: absolute;
    width: 200px;
    height: 200px;
    transition: all 0.25s ease-out;
    cursor: pointer;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    -webkit-user-drag: none;
    user-drag: none;
}

#kid img, #kid svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

#boot {
    position: absolute;
    left: 10%;
    bottom: 10%;
    width: 120px;
    height: 120px;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    -webkit-user-drag: none;
    user-drag: none;
}

#boot img, #boot svg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}

.hit {
    animation: childHit 0.6s ease-out forwards;
}

@keyframes childHit {
    0%   { transform: scale(1) rotate(0deg); }
    25%  { transform: scale(1.42) rotate(19deg) translateY(-42px); }
    60%  { transform: scale(0.86) rotate(-23deg) translateY(26px); }
    100% { transform: scale(1) rotate(0deg); }
}

#topUI {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    z-index: 60;
}

#scorePanel {
    background: #fff;
    border: 5px solid #5c4033;
    padding: 10px 20px;
    border-radius: 15px;
    font-size: 28px;
    font-weight: 700;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
}

#combo {
    font-size: 22px;
    color: #c0392b;
    background: #fff;
    padding: 6px 18px;
    border-radius: 12px;
    border: 4px solid #c0392b;
    opacity: 0;
    transition: all 0.4s;
    box-shadow: 0 5px 12px rgba(0,0,0,0.15);
}

.floating {
    position: absolute;
    font-size: 33px;
    font-weight: 700;
    color: #d35400;
    pointer-events: none;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.35);
    animation: floatPhrase 2.2s forwards;
    z-index: 35;
}

@keyframes floatPhrase {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-235px) scale(0.55); }
}

#message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    color: #c0392b;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    z-index: 60;
    text-align: center;
    width: 100%;
}

button {
    padding: 12px 24px;
    font-family: 'Comic Neue', cursive;
    font-size: 18px;
    background: #fff;
    color: #333;
    border: 5px solid #5c4033;
    border-radius: 15px;
    box-shadow: 0 6px 0 #3c2a1f;
    cursor: pointer;
    transition: all 0.1s;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #3c2a1f;
}

#bottomUI {
    width: 100%;
    display: flex;
    justify-content: center;
    z-index: 60;
}

#shopBtn {
    width: 80%;
    max-width: 250px;
}

#adminBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 4px solid #5c4033;
    background: #fff;
    font-size: 20px;
    font-weight: 700;
    z-index: 120;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

#shop {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 440px;
    background: #fff9e6;
    border: 8px solid #5c4033;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    padding: 20px;
    display: none;
    z-index: 100;
    max-height: 80vh;
    overflow-y: auto;
    box-sizing: border-box;
}

.shop-section {
    margin-bottom: 30px;
}

.shop-section h3 {
    margin: 0 0 15px 0;
    font-size: 24px;
    color: #5c4033;
    border-bottom: 4px solid #c0392b;
    padding-bottom: 8px;
}

.item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    margin: 10px 0;
    background: #fff;
    border: 4px solid #5c4033;
    border-radius: 15px;
    gap: 15px;
    font-size: 18px;
}

.item-icon {
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
}

.item-icon svg, .item-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

@media(max-height: 600px) {
    #game { height: 100vh; border-radius: 0; border: none; }
    #kid { width: 150px; height: 150px; }
    #boot { width: 90px; height: 90px; }
}
</style>
</head>

<body>

<div id="game">
    <button id="adminBtn">A</button>

    <div id="topUI">
        <div id="scorePanel">
            Очки: <span id="count">0</span>
        </div>

        <div id="combo">
            ×<span id="comboCount">1</span> КОМБО
        </div>
    </div>

    <div id="actionArea">
        <div id="kid"></div>
        <div id="boot"></div>
        <div id="message"></div>
    </div>

    <div id="bottomUI">
        <button id="shopBtn">🛒 МАГАЗИН</button>
    </div>
</div>

<div id="shop">
    <h2 style="text-align:center; margin-bottom:20px; color:#5c4033; margin-top: 0;">
        МАГАЗИН
    </h2>

    <div class="shop-section">
        <h3>🔧 УЛУЧШЕНИЯ</h3>
        <div id="upgrades"></div>
    </div>

    <div class="shop-section">
        <h3>🥾 ТИПЫ ПИНКА</h3>
        <div id="weaponSkins"></div>
    </div>

    <div class="shop-section">
        <h3>🍰 КОРМЛЕНИЕ</h3>
        <div class="item">
            <div class="item-icon">
                <svg viewBox="0 0 64 64"><path d="M12 36h40v16H12z" fill="#f39c12"/><path d="M8 48h48v8H8z" fill="#d35400"/><circle cx="32" cy="24" r="8" fill="#e74c3c"/><path d="M30 24h4v12h-4z" fill="#f1c40f"/></svg>
            </div>
            <div style="flex:1;">
                <strong>Тортик</strong><br>
                <small style="font-size: 14px; color: #666;">Покормить ребёнка (+30–60 очков)</small>
            </div>
            <button onclick="feedKid()" style="font-size: 15px; padding: 8px 12px;">Покормить</button>
        </div>
    </div>

    <div class="shop-section">
        <h3>🖼️ КАРТИНКИ</h3>
        <div class="item" style="font-size:16px; flex-direction: column; align-items: flex-start; gap: 8px;">
            <div>
                <strong>Поставить картинку оружия</strong><br>
                <small style="color: #666;">Только локально</small>
            </div>
            <input type="file" id="weaponImageInput" style="width: 100%;">
        </div>

        <div class="item" style="font-size:16px; flex-direction: column; align-items: flex-start; gap: 8px;">
            <div>
                <strong>Поставить картинку ребёнка</strong><br>
                <small style="color: #666;">Только локально</small>
            </div>
            <input type="file" id="kidImageInput" style="width: 100%;">
        </div>
        <div id="globalAdminImages"></div>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <button onclick="closeShop()">ЗАКРЫТЬ МАГАЗИН</button>
    </div>
</div>

<audio id="monsterAudio" loop>
    <source src="monster.mp3" type="audio/mpeg">
</audio>

<script>
let score = 0;
let combo = 1;
let lastHit = 0;
let streak = 0;
let isEpicMode = false;

let multipliers = {
    power: 1,
    comboSpeed: 1,
    auto: 0
};

let isAdmin = false;

let globalImages = JSON.parse(localStorage.getItem('globalWeaponImages') || '{}');
let localImages = JSON.parse(localStorage.getItem('localWeaponImages') || '{}');

const upgradesList = [
    {
        id: "power",
        name: "Сильный удар",
        costBase: 120,
        level: 0,
        max: 12,
        desc: "+25% очков",
        effect: () => multipliers.power += 0.25
    },
    {
        id: "combo",
        name: "Быстрое комбо",
        costBase: 280,
        level: 0,
        max: 8,
        desc: "Комбо быстрее",
        effect: () => multipliers.comboSpeed += 0.3
    },
    {
        id: "auto",
        name: "Авто-пинки",
        costBase: 450,
        level: 0,
        max: 10,
        desc: "+3 очка/сек",
        effect: () => multipliers.auto += 3
    }
];

// Пачка качественных SVG взамен текстовых смайлов
const svgIcons = {
    baby: `<svg viewBox="0 0 64 64"><circle cx="32" cy="36" r="18" fill="#f3c19d"/><circle cx="26" cy="34" r="2" fill="#333"/><circle cx="38" cy="34" r="2" fill="#333"/><path d="M28 44q4 3 8 0" stroke="#333" stroke-width="2" fill="none"/><path d="M32 18c-5 0-9 4-9 8s2 4 5 1" fill="#f2a172"/></svg>`,
    boot: `<svg viewBox="0 0 64 64"><path d="M16 12h16v24l16 8v10H12V32z" fill="#795548"/><path d="M12 50h36v4H12z" fill="#3e2723"/><circle cx="20" cy="20" r="2" fill="#fff"/><circle cx="20" cy="28" r="2" fill="#fff"/></svg>`,
    pan: `<svg viewBox="0 0 64 64"><circle cx="26" cy="32" r="18" fill="#37474f"/><path d="M40 32h18v4H40z" fill="#212121"/></svg>`,
    iron: `<svg viewBox="0 0 64 64"><path d="M12 48h40V32C52 20 40 16 32 16H12z" fill="#b0bec5"/><path d="M16 24h20v4H16z" fill="#78909c"/><path d="M12 48h40v4H12z" fill="#37474f"/></svg>`,
    belt: `<svg viewBox="0 0 64 64"><path d="M8 28h40v8H8z" fill="#5d4037"/><rect x="44" y="24" width="12" height="16" fill="#f1c40f" rx="2"/></svg>`,
    arm: `<svg viewBox="0 0 64 64"><rect x="12" y="28" width="40" height="8" fill="#90a4ae" rx="2"/><path d="M16 28h4v8h-4zM28 28h4v8h-4zM40 28h4v8h-4z" fill="#78909c"/></svg>`,
    stool: `<svg viewBox="0 0 64 64"><rect x="14" y="20" width="36" height="8" fill="#a1887f" rx="3"/><rect x="18" y="28" width="6" height="24" fill="#8d6e63"/><rect x="40" y="28" width="6" height="24" fill="#8d6e63"/></svg>`
};

// Адаптированные траектории под резиновое мобильное окно (вместо жестких 500px)
const weaponSkins = [
    { name: "Ботинок", svg: svgIcons.boot, anim: "translate(130px, -100px) rotate(-55deg)", phrases: ["Ой", "Ай"] },
    { name: "Сковорода", svg: svgIcons.pan, anim: "translate(120px, -90px) rotate(-130deg)", phrases: ["Ай", "Больно"] },
    { name: "Утюг", svg: svgIcons.iron, anim: "translate(140px, -85px) scale(0.85)", phrases: ["Горячо", "Печёт"] },
    { name: "Ремень", svg: svgIcons.belt, anim: "translate(100px, -120px) rotate(48deg)", phrases: ["Ай", "Не надо"] },
    { name: "Арматура", svg: svgIcons.arm, anim: "translate(140px, -70px)", phrases: ["Ой", "Больно"] },
    { name: "Табуретка", svg: svgIcons.stool, anim: "translate(110px, -110px) rotate(92deg)", phrases: ["АЙ", "ХВАТИТ"] }
];

let currentWeapon = 0;

const kidEl = document.getElementById('kid');
const bootEl = document.getElementById('boot');
const countEl = document.getElementById('count');
const comboEl = document.getElementById('combo');
const comboCountEl = document.getElementById('comboCount');
const msgEl = document.getElementById('message');
const shopEl = document.getElementById('shop');
const monsterAudio = document.getElementById('monsterAudio');

function updateCustomImages() {
    const kidImg = localStorage.getItem('kidImage');
    const globalKidImg = localStorage.getItem('globalKidImage');

    if (kidImg) {
        kidEl.innerHTML = `<img src="${kidImg}">`;
    } else if (globalKidImg) {
        kidEl.innerHTML = `<img src="${globalKidImg}">`;
    } else {
        kidEl.innerHTML = svgIcons.baby;
    }

    const localWeapon = localImages[currentWeapon];
    const globalWeapon = globalImages[currentWeapon];

    if (localWeapon) {
        bootEl.innerHTML = `<img src="${localWeapon}">`;
    } else if (globalWeapon) {
        bootEl.innerHTML = `<img src="${globalWeapon}">`;
    } else {
        bootEl.innerHTML = weaponSkins[currentWeapon].svg;
    }
}

function kick() {
    const now = Date.now();
    const timeDiff = now - lastHit;

    if (timeDiff < 2100 / multipliers.comboSpeed) {
        streak++;
        combo = Math.min(9, Math.floor(streak / 4) + 1);
    } else {
        streak = 1;
        combo = 1;
    }

    lastHit = now;

    const points = Math.floor(7 * multipliers.power * combo);
    score += points;

    countEl.textContent = Math.floor(score).toLocaleString('ru-RU');

    kidEl.classList.remove('hit');
    void kidEl.offsetWidth;
    kidEl.classList.add('hit');

    bootEl.style.transform = weaponSkins[currentWeapon].anim;

    setTimeout(() => {
        bootEl.style.transform = '';
    }, 340);

    if (currentWeapon === 5) {
        document.body.style.background = '#9f0000';
        isEpicMode = true;
        if (monsterAudio.paused) {
            monsterAudio.play().catch(() => {});
        }
    }

    comboCountEl.textContent = combo;
    comboEl.style.opacity = '1';

    setTimeout(() => {
        if (Date.now() - lastHit > 1700) {
            comboEl.style.opacity = '0';
        }
    }, 700);
}

window.feedKid = function() {
    score += 35 + Math.floor(Math.random() * 35);
    countEl.textContent = Math.floor(score).toLocaleString('ru-RU');

    kidEl.style.transform = 'scale(1.15)';
    setTimeout(() => {
        kidEl.style.transform = 'scale(1)';
    }, 500);
};

// Запуск фонового автокликера
setInterval(() => {
    if (multipliers.auto > 0) {
        score += multipliers.auto;
        countEl.textContent = Math.floor(score).toLocaleString('ru-RU');
        saveGame();
    }
}, 1000);

function renderShop() {
    const upContainer = document.getElementById('upgrades');
    upContainer.innerHTML = '';

    upgradesList.forEach((up, i) => {
        const cost = Math.floor(up.costBase * Math.pow(1.4, up.level));
        const div = document.createElement('div');
        div.className = 'item';
        div.style.fontSize = '18px';
        div.innerHTML = `
        <div style="flex:1;">
            <strong>${up.name}</strong><br>
            <small style="color:#666;">${up.desc} • Уровень ${up.level}/${up.max}</small>
        </div>
        <button onclick="buyUpgrade(${i})" style="font-size:15px; padding:8px 12px;">
            ${cost} очков
        </button>
        `;
        upContainer.appendChild(div);
    });

    const weaponContainer = document.getElementById('weaponSkins');
    weaponContainer.innerHTML = '';

    weaponSkins.forEach((skin, i) => {
        const div = document.createElement('div');
        div.className = 'item';
        
        let displayIcon = skin.svg;
        if (localImages[i]) displayIcon = `<img src="${localImages[i]}">`;
        else if (globalImages[i]) displayIcon = `<img src="${globalImages[i]}">`;

        div.innerHTML = `
        <div class="item-icon">${displayIcon}</div>
        <div style="flex:1;">
            <strong>${skin.name}</strong>
        </div>
        <button onclick="selectWeapon(${i})" style="font-size:15px; padding:8px 12px;">
            Выбрать
        </button>
        `;
        weaponContainer.appendChild(div);
    });

    const adminDiv = document.getElementById('globalAdminImages');
    if (isAdmin) {
        adminDiv.innerHTML = `
        <div class="item" style="font-size:16px; flex-direction: column; align-items: flex-start; gap: 8px;">
            <div><strong>ГЛОБАЛЬНАЯ картинка оружия</strong></div>
            <input type="file" id="globalWeaponInput" style="width:100%;">
        </div>
        <div class="item" style="font-size:16px; flex-direction: column; align-items: flex-start; gap: 8px;">
            <div><strong>ГЛОБАЛЬНАЯ картинка ребёнка</strong></div>
            <input type="file" id="globalKidInput" style="width:100%;">
        </div>
        `;
    } else {
        adminDiv.innerHTML = '';
    }
}

window.buyUpgrade = function(i) {
    const up = upgradesList[i];
    const cost = Math.floor(up.costBase * Math.pow(1.4, up.level));

    if (score >= cost && up.level < up.max) {
        score -= cost;
        up.level++;
        up.effect();
        countEl.textContent = Math.floor(score).toLocaleString('ru-RU');
        renderShop();
        saveGame();
    }
};

window.selectWeapon = function(i) {
    currentWeapon = i;
    updateCustomImages();

    if (isEpicMode) {
        document.body.style.background = 'linear-gradient(#f8f1e3, #e8d9c0)';
        monsterAudio.pause();
        isEpicMode = false;
    }

    saveGame();
    closeShop();
};

function openShop() {
    shopEl.style.display = 'block';
    renderShop();
}

function closeShop() {
    shopEl.style.display = 'none';
}

function saveGame() {
    localStorage.setItem(
        'bootkickEmojiFinal',
        JSON.stringify({
            score,
            multipliers,
            currentWeapon,
            upgrades: upgradesList.map(u => ({ id: u.id, level: u.level }))
        })
    );
}

function loadSave() {
    const data = localStorage.getItem('bootkickEmojiFinal');
    if (data) {
        const parsed = JSON.parse(data);
        score = parsed.score || 0;
        if (parsed.multipliers) {
            multipliers = parsed.multipliers;
        }
        currentWeapon = parsed.currentWeapon || 0;

        if (parsed.upgrades) {
            parsed.upgrades.forEach(savedUp => {
                const realUp = upgradesList.find(u => u.id === savedUp.id);
                if (realUp) {
                    realUp.level = savedUp.level || 0;
                }
            });
            // Восстановление чистых функций расчета после перезагрузки
            multipliers.power = 1 + (upgradesList.find(u => u.id === "power").level * 0.25);
            multipliers.comboSpeed = 1 + (upgradesList.find(u => u.id === "combo").level * 0.3);
            multipliers.auto = upgradesList.find(u => u.id === "auto").level * 3;
        }
    }

    countEl.textContent = Math.floor(score).toLocaleString('ru-RU');
    updateCustomImages();
}

document.getElementById('adminBtn').addEventListener('click', () => {
    const pass = prompt('Введите пароль');
    if (pass === 'admin123') {
        isAdmin = true;
        alert('Админ режим включен');
        renderShop();
    } else {
        alert('Неверный пароль');
    }
});

document.addEventListener('change', function(e) {
    if (e.target.id === 'weaponImageInput') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            localImages[currentWeapon] = ev.target.result;
            localStorage.setItem('localWeaponImages', JSON.stringify(localImages));
            updateCustomImages();
            renderShop();
        };
        reader.readAsDataURL(file);
    }

    if (e.target.id === 'kidImageInput') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            localStorage.setItem('kidImage', ev.target.result);
            updateCustomImages();
        };
        reader.readAsDataURL(file);
    }

    if (e.target.id === 'globalWeaponInput' && isAdmin) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            globalImages[currentWeapon] = ev.target.result;
            localStorage.setItem('globalWeaponImages', JSON.stringify(globalImages));
            updateCustomImages();
            renderShop();
        };
        reader.readAsDataURL(file);
    }

    if (e.target.id === 'globalKidInput' && isAdmin) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            localStorage.setItem('globalKidImage', ev.target.result);
            updateCustomImages();
        };
        reader.readAsDataURL(file);
    }
});

kidEl.addEventListener('click', kick);
bootEl.addEventListener('click', kick);
document.getElementById('shopBtn').addEventListener('click', openShop);

loadSave();

setTimeout(() => {
    msgEl.textContent = "КЛИКАЙ НА 👶";
    msgEl.style.opacity = '1';
    setTimeout(() => {
        msgEl.style.opacity = '0';
    }, 2800);
}, 600);
</script>
