<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ПИНОК ПО ВИРТУАЛЬНОМУ РЕБЁНКУ</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght=400;700&display=swap');

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(#f8f1e3, #e8d9c0);
    color: #333;
    font-family: 'Comic Neue', cursive;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    transition: background 1.2s ease;

    touch-action: manipulation;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

/* --- ПК ДИЗАЙН (Твой оригинал) --- */
@media (min-width: 861px) {
    #game {
        position: relative;
        width: 860px;
        height: 560px;
        border: 10px solid #5c4033;
        background: #fff9e6;
        box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        overflow: hidden;
        border-radius: 20px;
    }

    #kid {
        position: absolute;
        left: 310px;
        top: 115px;
        width: 230px;
        height: 230px;
        transition: all 0.25s ease-out;
        cursor: pointer;
        z-index: 10;
    }

    #boot {
        position: absolute;
        left: 90px;
        bottom: 75px;
        width: 165px;
        height: 165px;
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        z-index: 20;
    }

    #scorePanel {
        position: absolute;
        top: 25px;
        left: 30px;
        background: #fff;
        border: 6px solid #5c4033;
        padding: 15px 30px;
        border-radius: 15px;
        font-size: 34px;
        font-weight: 700;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        z-index: 60;
    }

    #combo {
        position: absolute;
        top: 105px;
        left: 35px;
        font-size: 30px;
        color: #c0392b;
        background: #fff;
        padding: 10px 25px;
        border-radius: 15px;
        border: 5px solid #c0392b;
        opacity: 0;
        transition: all 0.4s;
        box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        z-index: 60;
    }

    #message {
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 42px;
        color: #c0392b;
        font-weight: 700;
        opacity: 0;
        pointer-events: none;
        z-index: 60;
        text-align: center;
    }

    #shopBtn {
        position: absolute;
        bottom: 28px;
        right: 32px;
    }

    #adminBtn {
        position: absolute;
        top: 12px;
        right: 14px;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 4px solid #5c4033;
        background: #fff;
        font-size: 22px;
        font-weight: 700;
        z-index: 120;
        padding: 0;
    }

    #shop {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 720px;
        background: #fff9e6;
        border: 10px solid #5c4033;
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        padding: 30px;
        display: none;
        z-index: 100;
        max-height: 82vh;
        overflow-y: auto;
    }
}

/* --- МОБИЛЬНЫЙ ДИЗАЙН (Вертикальный адаптив) --- */
@media (max-width: 860px) {
    #game {
        position: relative;
        width: 100%;
        height: 100vh;
        background: #fff9e6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
    }

    #scorePanel {
        margin-top: 10px;
        background: #fff;
        border: 5px solid #5c4033;
        padding: 10px 20px;
        border-radius: 15px;
        font-size: 28px;
        font-weight: 700;
        align-self: flex-start;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    #combo {
        margin-top: 5px;
        font-size: 22px;
        color: #c0392b;
        background: #fff;
        padding: 6px 16px;
        border-radius: 12px;
        border: 4px solid #c0392b;
        opacity: 0;
        transition: all 0.4s;
        align-self: flex-start;
        box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }

    #kid {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 190px;
        height: 190px;
        transition: all 0.25s ease-out;
        cursor: pointer;
        z-index: 10;
    }

    #boot {
        position: absolute;
        bottom: 18%;
        left: 15%;
        width: 120px;
        height: 120px;
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        z-index: 20;
    }

    #message {
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 32px;
        color: #c0392b;
        font-weight: 700;
        opacity: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
    }

    #shopBtn {
        width: 85%;
        margin-bottom: 15px;
    }

    #adminBtn {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 4px solid #5c4033;
        background: #fff;
        font-size: 22px;
        font-weight: 700;
        z-index: 120;
    }

    #shop {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 92%;
        background: #fff9e6;
        border: 8px solid #5c4033;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        padding: 20px;
        display: none;
        z-index: 100;
        max-height: 85vh;
        overflow-y: auto;
        box-sizing: border-box;
    }
}

/* Общие стили для картинок внутри игровых зон */
#kid img, #boot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
}

.hit {
    animation: childHit 0.6s ease-out forwards;
}

@keyframes childHit {
    0%   { transform: scale(1) rotate(0deg); }
    25%  { transform: scale(1.42) rotate(19deg) translateY(-42px); }
    60%  { transform: scale(0.86) rotate(-23deg) translateY(26px); }
    100% { transform: scale(1) rotate(0deg); }
}

.floating {
    position: absolute;
    font-size: 33px;
    font-weight: 700;
    color: #d35400;
    pointer-events: none;
    text-shadow: 3px 3px 6px rgba(0,0,0,0.35);
    animation: floatPhrase 2.2s forwards;
    z-index: 35;
}

@keyframes floatPhrase {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-235px) scale(0.55); }
}

button {
    padding: 12px 26px;
    font-family: 'Comic Neue', cursive;
    font-size: 19px;
    background: #fff;
    color: #333;
    border: 5px solid #5c4033;
    border-radius: 15px;
    box-shadow: 0 7px 0 #3c2a1f;
    cursor: pointer;
    transition: all 0.1s;
}

button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #3c2a1f;
}

.shop-section {
    margin-bottom: 30px;
}

.shop-section h3 {
    margin: 0 0 15px 0;
    font-size: 26px;
    color: #5c4033;
    border-bottom: 4px solid #c0392b;
    padding-bottom: 8px;
}

.item {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    margin: 12px 0;
    background: #fff;
    border: 4px solid #5c4033;
    border-radius: 16px;
    gap: 20px;
    font-size: 20px;
}

.shop-img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    flex-shrink: 0;
}
</style>
</head>

<body>

<div id="game">
    <div id="scorePanel">
        Очки: <span id="count">0</span>
    </div>

    <div id="combo">
        ×<span id="comboCount">1</span> КОМБО
    </div>

    <div id="kid"></div>
    <div id="boot"></div>
    <div id="message"></div>

    <button id="shopBtn">🛒 МАГАЗИН</button>
    <button id="adminBtn">A</button>
</div>

<div id="shop">
    <h2 style="text-align:center; margin-bottom:25px; color:#5c4033; margin-top: 0;">
        МАГАЗИН
    </h2>

    <div class="shop-section">
        <h3>🔧 УЛУЧШЕНИЯ</h3>
        <div id="upgrades"></div>
    </div>

    <div class="shop-section">
        <h3>🥾 ТИПЫ ПИНКА</h3>
        <div id="weaponSkins"></div>
    </div>

    <div class="shop-section">
        <h3>🍰 КОРМЛЕНИЕ</h3>
        <div class="item">
            <img src="https://i.postimg.co/258zZg67/cake.png" class="shop-img" alt="Cake">
            <div style="flex:1;">
                <strong>Тортик</strong><br>
                <small style="color: #666;">Покормить ребёнка (+30–60 очков)</small>
            </div>
            <button onclick="feedKid()">Покормить</button>
        </div>
    </div>

    <div class="shop-section">
        <h3>🖼️ КАРТИНКИ</h3>
        <div class="item" style="font-size:18px;">
            <div style="flex:1;">
                <strong>Поставить картинку оружия</strong><br>
                <small style="color:#666;">Только локально</small>
            </div>
            <input type="file" id="weaponImageInput">
        </div>

        <div class="item" style="font-size:18px;">
            <div style="flex:1;">
                <strong>Поставить картинку ребёнка</strong><br>
                <small style="color:#666;">Только локально</small>
            </div>
            <input type="file" id="kidImageInput">
        </div>
        <div id="globalAdminImages"></div>
    </div>

    <div style="text-align:center; margin-top:30px;">
        <button onclick="closeShop()">ЗАКРЫТЬ МАГАЗИН</button>
    </div>
</div>

<audio id="monsterAudio" loop>
    <source src="monster.mp3" type="audio/mpeg">
</audio>

<script>
let score = 0;
let combo = 1;
let lastHit = 0;
let streak = 0;
let isEpicMode = false;

let multipliers = {
    power: 1,
    comboSpeed: 1,
    auto: 0
};

let isAdmin = false;

let globalImages = JSON.parse(localStorage.getItem('globalWeaponImages') || '{}');
let localImages = JSON.parse(localStorage.getItem('localWeaponImages') || '{}');

const upgradesList = [
    {
        id: "power",
        name: "Сильный удар",
        costBase: 120,
        level: 0,
        max: 12,
        desc: "+25% очков",
        effect: () => multipliers.power += 0.25
    },
    {
        id: "combo",
        name: "Быстрое комбо",
        costBase: 280,
        level: 0,
        max: 8,
        desc: "Комбо быстрее",
        effect: () => multipliers.comboSpeed += 0.3
    },
    {
        id: "auto",
        name: "Авто-пинки",
        costBase: 450,
        level: 0,
        max: 10,
        desc: "+3 очка/сек",
        effect: () => multipliers.auto += 3
    }
];

// Реалистичные стабильные URL-картинки предметов
const defaultImages = {
    baby: "https://i.postimg.co/7YmXvX8k/baby.png",
    boot: "https://i.postimg.co/D0mC0Wf0/boot.png",
    pan: "https://i.postimg.co/9fXfM63v/pan.png",
    iron: "https://i.postimg.co/v8YmbyFf/iron.png",
    belt: "https://i.postimg.co/mZ8P8Dkg/belt.png",
    arm: "https://i.postimg.co/k5byzSgq/armature.png",
    stool: "https://i.postimg.co/GhwXwzS9/stool.png"
};

const isMobile = () => window.innerWidth <= 860;

// Анимации подстраиваются автоматически: на ПК — твой translateX/Y, на мобилках — чистый красивый замах
const getAnimTransform = (index) => {
    if (!isMobile()) {
        const pcAnims = [
            "translateX(520px) translateY(-170px) rotate(-55deg)",
            "translateX(510px) translateY(-155px) rotate(-130deg)",
            "translateX(530px) translateY(-135px) scale(0.85)",
            "translateX(470px) translateY(-205px) rotate(48deg)",
            "translateX(545px) translateY(-125px)",
            "translateX(495px) translateY(-195px) rotate(92deg)"
        ];
        return pcAnims[index];
    } else {
        const mobAnims = [
            "translate(110px, -120px) rotate(-45deg)",
            "translate(100px, -110px) rotate(-110deg)",
            "translate(110px, -90px) scale(0.85)",
            "translate(90px, -130px) rotate(40deg)",
            "translate(120px, -90px) rotate(-15deg)",
            "translate(95px, -120px) rotate(80deg)"
        ];
        return mobAnims[index];
    }
};

const weaponSkins = [
    { name: "Ботинок", url: defaultImages.boot, phrases: ["Ой", "Ай"] },
    { name: "Сковорода", url: defaultImages.pan, phrases: ["Ай", "Больно"] },
    { name: "Утюг", url: defaultImages.iron, phrases: ["Горячо", "Печёт"] },
    { name: "Ремень", url: defaultImages.belt, phrases: ["Ай", "Не надо"] },
    { name: "Арматура", url: defaultImages.arm, phrases: ["Ой", "Больно"] },
    { name: "Табуретка", url: defaultImages.stool, phrases: ["АЙ", "ХВАТИТ"] }
];

let currentWeapon = 0;

const kidEl = document.getElementById('kid');
const bootEl = document.getElementById('boot');
const countEl = document.getElementById('count');
const comboEl = document.getElementById('combo');
const comboCountEl = document.getElementById('comboCount');
const msgEl = document.getElementById('message');
const shopEl = document.getElementById('shop');
const monsterAudio = document.getElementById('monsterAudio');

function updateCustomImages() {
    const kidImg = localStorage.getItem('kidImage');
    const globalKidImg = localStorage.getItem('globalKidImage');

    if (kidImg) {
        kidEl.innerHTML = `<img src="${kidImg}">`;
    } else if (globalKidImg) {
        kidEl.innerHTML = `<img src="${globalKidImg}">`;
    } else {
        kidEl.innerHTML = `<img src="${defaultImages.baby}">`;
    }

    const localWeapon = localImages[currentWeapon];
    const globalWeapon = globalImages[currentWeapon];

    if (localWeapon) {
        bootEl.innerHTML = `<img src="${localWeapon}">`;
    } else if (globalWeapon) {
        bootEl.innerHTML = `<img src="${globalWeapon}">`;
    } else {
        bootEl.innerHTML = `<img src="${weaponSkins[currentWeapon].url}">`;
    }
}

function kick() {
    const now = Date.now();
    const timeDiff = now - lastHit;

    if (timeDiff < 2100 / multipliers.comboSpeed) {
        streak++;
        combo = Math.min(9, Math.floor(streak / 4) + 1);
    } else {
        streak = 1;
        combo = 1;
    }

    lastHit = now;

    const points = Math.floor(7 * multipliers.power * combo);
    score += points;

    countEl.textContent = Math.floor(score).toLocaleString('ru-RU');

    kidEl.classList.remove('hit');
    void kidEl.offsetWidth;
    kidEl.classList.add('hit');

    bootEl.style.transform = getAnimTransform(currentWeapon);

    setTimeout(() => {
        bootEl.style.transform = '';
    }, 340);

    if (currentWeapon === 5) {
        document.body.style.background = '#9f0000';
        isEpicMode = true;
        if (monsterAudio.paused) {
            monsterAudio.play().catch(() => {});
        }
    }

    comboCountEl.textContent = combo;
    comboEl.style.opacity = '1';

    setTimeout(() => {
        if (Date.now() - lastHit > 1700) {
            comboEl.style.opacity = '0';
        }
    }, 700);
}

window.feedKid = function() {
    score += 35 + Math.floor(Math.random() * 35);
    countEl.textContent = Math.floor(score).toLocaleString('ru-RU');

    kidEl.style.transform = 'scale(1.15)';
    setTimeout(() => {
        kidEl.style.transform = 'scale(1)';
    }, 500);
};

// Запуск фонового автокликера
setInterval(() => {
    if (multipliers.auto > 0) {
        score += multipliers.auto;
        countEl.textContent = Math.floor(score).toLocaleString('ru-RU');
        saveGame();
    }
}, 1000);

function renderShop() {
    const upContainer = document.getElementById('upgrades');
    upContainer.innerHTML = '';

    upgradesList.forEach((up, i) => {
        const cost = Math.floor(up.costBase * Math.pow(1.4, up.level));
        const div = document.createElement('div');
        div.className = 'item';
        div.style.fontSize = '20px';
        div.innerHTML = `
        <div style="flex:1;">
            <strong>${up.name}</strong><br>
            <small style="color:#666;">${up.desc} • Уровень ${up.level}/${up.max}</small>
        </div>
        <button onclick="buyUpgrade(${i})">
            ${cost} очков
        </button>
        `;
        upContainer.appendChild(div);
    });

    const weaponContainer = document.getElementById('weaponSkins');
    weaponContainer.innerHTML = '';

    weaponSkins.forEach((skin, i) => {
        const div = document.createElement('div');
        div.className = 'item';
        
        let displayUrl = skin.url;
        if (localImages[i]) displayUrl = localImages[i];
        else if (globalImages[i]) displayUrl = globalImages[i];

        div.innerHTML = `
        <img src="${displayUrl}" class="shop-img" alt="${skin.name}">
        <div style="flex:1;">
            <strong>${skin.name}</strong>
        </div>
        <button onclick="selectWeapon(${i})">
            Выбрать
        </button>
        `;
        weaponContainer.appendChild(div);
    });

    const adminDiv = document.getElementById('globalAdminImages');
    if (isAdmin) {
        adminDiv.innerHTML = `
        <div class="item" style="font-size:18px; flex-direction: column; align-items: flex-start; gap: 8px;">
            <div><strong>ГЛОБАЛЬНАЯ картинка оружия</strong></div>
            <input type="file" id="globalWeaponInput" style="width:100%;">
        </div>
        <div class="item" style="font-size:18px; flex-direction: column; align-items: flex-start; gap: 8px;">
            <div><strong>ГЛОБАЛЬНАЯ картинка ребёнка</strong></div>
            <input type="file" id="globalKidInput" style="width:100%;">
        </div>
        `;
    } else {
        adminDiv.innerHTML = '';
    }
}

window.buyUpgrade = function(i) {
    const up = upgradesList[i];
    const cost = Math.floor(up.costBase * Math.pow(1.4, up.level));

    if (score >= cost && up.level < up.max) {
        score -= cost;
        up.level++;
        up.effect();
        countEl.textContent = Math.floor(score).toLocaleString('ru-RU');
        renderShop();
        saveGame();
    }
};

window.selectWeapon = function(i) {
    currentWeapon = i;
    updateCustomImages();

    if (isEpicMode) {
        document.body.style.background = 'linear-gradient(#f8f1e3, #e8d9c0)';
        monsterAudio.pause();
        isEpicMode = false;
    }

    saveGame();
    closeShop();
};

function openShop() {
    shopEl.style.display = 'block';
    renderShop();
}

function closeShop() {
    shopEl.style.display = 'none';
}

function saveGame() {
    localStorage.setItem(
        'bootkickEmojiFinal',
        JSON.stringify({
            score,
            multipliers,
            currentWeapon,
            upgrades: upgradesList.map(u => ({ id: u.id, level: u.level }))
        })
    );
}

function loadSave() {
    const data = localStorage.getItem('bootkickEmojiFinal');
    if (data) {
        const parsed = JSON.parse(data);
        score = parsed.score || 0;
        if (parsed.multipliers) {
            multipliers = parsed.multipliers;
        }
        currentWeapon = parsed.currentWeapon || 0;

        if (parsed.upgrades) {
            parsed.upgrades.forEach(savedUp => {
                const realUp = upgradesList.find(u => u.id === savedUp.id);
                if (realUp) {
                    realUp.level = savedUp.level || 0;
                }
            });
            multipliers.power = 1 + (upgradesList.find(u => u.id === "power").level * 0.25);
            multipliers.comboSpeed = 1 + (upgradesList.find(u => u.id === "combo").level * 0.3);
            multipliers.auto = upgradesList.find(u => u.id === "auto").level * 3;
        }
    }

    countEl.textContent = Math.floor(score).toLocaleString('ru-RU');
    updateCustomImages();
}

document.getElementById('adminBtn').addEventListener('click', () => {
    const pass = prompt('Введите пароль');
    if (pass === 'admin123') {
        isAdmin = true;
        alert('Админ режим включен');
        renderShop();
    } else {
        alert('Неверный пароль');
    }
});

document.addEventListener('change', function(e) {
    if (e.target.id === 'weaponImageInput') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            localImages[currentWeapon] = ev.target.result;
            localStorage.setItem('localWeaponImages', JSON.stringify(localImages));
            updateCustomImages();
            renderShop();
        };
        reader.readAsDataURL(file);
    }

    if (e.target.id === 'kidImageInput') {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            localStorage.setItem('kidImage', ev.target.result);
            updateCustomImages();
        };
        reader.readAsDataURL(file);
    }

    if (e.target.id === 'globalWeaponInput' && isAdmin) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            globalImages[currentWeapon] = ev.target.result;
            localStorage.setItem('globalWeaponImages', JSON.stringify(globalImages));
            updateCustomImages();
            renderShop();
        };
        reader.readAsDataURL(file);
    }

    if (e.target.id === 'globalKidInput' && isAdmin) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            localStorage.setItem('globalKidImage', ev.target.result);
            updateCustomImages();
        };
        reader.readAsDataURL(file);
    }
});
